[project]
name = "anki-language-card-generator"
version = "0.1.0"
description = "Turn raw vocabulary lists or lesson notes into a finished Anki deck."
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_cardgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
